[tool.coverage.run]
source = ["main", "access_code", "services", "stockpicker", "market_hours"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 98
precision = 2
show_missing = true
skip_covered = true
sort = "cover"
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=main --cov=access_code --cov=services --cov=stockpicker --cov=market_hours --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestReturnNotNoneWarning"]
