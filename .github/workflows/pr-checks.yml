name: PR Critical Checks

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  lint-and-format:
    name: Code Syntax & Static Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff bandit

      - name: Critical Syntax & Error Check
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: General Code Linting
        run: |
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  dependency-checks:
    name: Dependency Compatibility & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check Package Compatibility
        run: |
          echo "Checking installed packages for version conflicts..."
          pip check

      - name: Audit Dependencies for Known Vulnerabilities (CVE Scan)
        run: |
          if [ -f requirements.txt ]; then
            echo "Auditing requirements.txt for security vulnerabilities..."
            pip-audit -r requirements.txt --local --desc || true
          fi

  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run Full Test Suite (Unit + Integration)
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v || true
          else
            echo "No tests directory in this repository, check passed."
          fi

  component-wiring-check:
    name: Component Wiring & Plug-in Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify Component Wiring & Imports
        run: |
          if [ -f "scripts/verify_component_wiring.py" ]; then
            python scripts/verify_component_wiring.py
          else
            echo "✅ No custom wiring script needed for this component."
          fi

  security-and-secret-scan:
    name: Security & Secret Leak Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Security Scan (Bandit)
        run: |
          pip install bandit
          bandit -r . -ll -ii --exit-zero

      - name: Secret Scan (Scan for API keys / Passwords)
        run: |
          python -c '
          import os, re, sys
          patterns = [
              r"(?i)api[_-]?key\s*=\s*[\"'\''\"][A-Za-z0-9_\-]{16,}[\"'\''\"]",
              r"(?i)secret[_-]?key\s*=\s*[\"'\''\"][A-Za-z0-9_\-]{16,}[\"'\''\"]",
              r"-----BEGIN (RSA|EC|PRIVATE) KEY-----"
          ]
          found = 0
          for root, _, files in os.walk("."):
              if ".git" in root or "__pycache__" in root: continue
              for f in files:
                  if f.endswith((".py", ".json", ".yaml", ".yml", ".env")):
                      filepath = os.path.join(root, f)
                      try:
                          with open(filepath, "r", encoding="utf-8", errors="ignore") as fh:
                              content = fh.read()
                              for pat in patterns:
                                  if re.search(pat, content):
                                      print(f"❌ POTENTIAL SECRET LEAK in {filepath}")
                                      found += 1
                      except Exception: pass
          if found > 0:
              print(f"Found {found} potential secret leaks!")
              sys.exit(1)
          print("✅ Secret scan passed: No plain-text API secrets found.")
          '

  gitleaks-scan:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
