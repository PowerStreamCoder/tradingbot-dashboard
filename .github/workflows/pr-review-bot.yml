name: Automated PR Review Bot

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-bot-review:
    name: Automated PR Reviewer (On-Demand)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Analysis Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit pip-audit

      - name: Analyze PR Diff, Comments, Logging & Dependencies
        id: analyze
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(py|txt|json|yaml|yml)$' || true)
          PYTHON_FILES=$(echo "$CHANGED_FILES" | grep '\.py$' || true)
          echo "Changed Files:"
          echo "$CHANGED_FILES"

          LINT_ERRORS=""
          if [ -n "$PYTHON_FILES" ]; then
            LINT_ERRORS=$(flake8 $PYTHON_FILES --count --select=E9,F63,F7,F82,E501,F401,F841 --show-source 2>&1 || true)
          fi

          SECURITY_ISSUES=""
          if [ -n "$PYTHON_FILES" ]; then
            SECURITY_ISSUES=$(bandit -r $PYTHON_FILES -ll -ii 2>&1 || true)
          fi

          DEPENDENCY_AUDIT_REPORT=""
          if [ -f requirements.txt ]; then
            DEPENDENCY_AUDIT_REPORT=$(pip-audit -r requirements.txt --local --desc 2>&1 || true)
          fi

          COMMENTS_AND_LOGGING_REPORT=""
          if [ -n "$PYTHON_FILES" ]; then
            printf '%s' "$PYTHON_FILES" > /tmp/prr_python_files.txt
            COMMENTS_AND_LOGGING_REPORT=$(PYTHON_FILES_FILE=/tmp/prr_python_files.txt python3 - << 'PYEOF'
          import os, sys, re, ast

          with open(os.environ.get("PYTHON_FILES_FILE", ""), "r", encoding="utf-8", errors="ignore") as _f:
              changed_files = _f.read().splitlines()
          report_lines = []

          for filepath in changed_files:
              filepath = filepath.strip()
              if not filepath or not os.path.exists(filepath):
                  continue
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                      lines = content.splitlines()
              except Exception:
                  continue

              file_issues = []

              if "tests/" not in filepath and "scripts/" not in filepath:
                  prints = []
                  for idx, line in enumerate(lines, 1):
                      stripped = line.strip()
                      if not stripped.startswith("#") and re.search(r"\bprint\s*\(", stripped):
                          prints.append("Line " + str(idx))
                  if prints:
                      file_issues.append("⚠️ **Raw print() statements found**: " + ", ".join(prints[:5]) + " (Use structured logger instead)")

              try:
                  tree = ast.parse(content, filename=filepath)
                  missing_docs = []
                  unlogged_excepts = []
                  for node in ast.walk(tree):
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                          if not node.name.startswith("_") and not ast.get_docstring(node):
                              missing_docs.append("`" + str(node.name) + "` (Line " + str(node.lineno) + ")")
                      elif isinstance(node, ast.ExceptHandler):
                          has_log = any(
                              isinstance(sub, ast.Call) and (
                                  (isinstance(sub.func, ast.Attribute) and sub.func.attr in ("error","exception","warning","info","log")) or
                                  (isinstance(sub.func, ast.Name) and sub.func.id in ("error","exception","warning","info","log"))
                              ) for sub in ast.walk(node)
                          )
                          if not has_log:
                              unlogged_excepts.append("Line " + str(node.lineno))

                  if missing_docs:
                      file_issues.append("📝 **Missing Docstrings/Comments**: " + ", ".join(missing_docs[:5]))
                  if unlogged_excepts:
                      file_issues.append("🚨 **Unlogged except block**: Lines " + ", ".join(unlogged_excepts[:3]))
              except Exception:
                  pass

              if file_issues:
                  report_lines.append("**`" + filepath + "`**:\n" + "\n".join("  - " + issue for issue in file_issues))

          if report_lines:
              print("\n".join(report_lines))
          else:
              print("✅ Code comments, docstrings, logger usage, and exception logging are properly implemented.")
          PYEOF
            )
          fi

          printf '%s' "$CHANGED_FILES" > /tmp/prr_changed_files.txt
          printf '%s' "$LINT_ERRORS" > /tmp/prr_lint_errors.txt
          printf '%s' "$SECURITY_ISSUES" > /tmp/prr_security_issues.txt
          printf '%s' "$COMMENTS_AND_LOGGING_REPORT" > /tmp/prr_comments_logging.txt
          printf '%s' "$DEPENDENCY_AUDIT_REPORT" > /tmp/prr_dep_audit.txt

          python3 - << 'PYEOF'
          import json

          def _read(path):
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      return f.read()
              except Exception:
                  return ""

          data = {
              "changed_files": _read("/tmp/prr_changed_files.txt").strip(),
              "lint_errors": _read("/tmp/prr_lint_errors.txt").strip(),
              "security_issues": _read("/tmp/prr_security_issues.txt").strip(),
              "comments_logging_report": _read("/tmp/prr_comments_logging.txt").strip(),
              "dep_audit_report": _read("/tmp/prr_dep_audit.txt").strip()
          }

          with open("/tmp/pr_review_data.json", "w", encoding="utf-8") as f:
              json.dump(data, f)
          PYEOF

      - name: Post Automated PR Review Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let reviewData = {};
            try {
              if (fs.existsSync('/tmp/pr_review_data.json')) {
                reviewData = JSON.parse(fs.readFileSync('/tmp/pr_review_data.json', 'utf8'));
              }
            } catch (e) {
              console.log('Failed to read review data file:', e);
            }

            const changedFiles = (reviewData.changed_files || 'None').substring(0, 1000);
            const lintErrors = (reviewData.lint_errors || '').trim();
            const securityIssues = (reviewData.security_issues || '').trim();
            const commentsLoggingReport = (reviewData.comments_logging_report || '').trim();
            const depAuditReport = (reviewData.dep_audit_report || '').trim();

            const hasLintErrors = Boolean(lintErrors && lintErrors !== '0' && !lintErrors.includes('0 critical'));
            const hasSecurityIssues = Boolean(securityIssues && !securityIssues.includes('No issues identified.'));
            const hasCommentsLoggingIssues = Boolean(commentsLoggingReport && (commentsLoggingReport.includes('⚠️') || commentsLoggingReport.includes('🚨')));
            const hasDepAuditIssues = Boolean(depAuditReport && !depAuditReport.includes('No known vulnerabilities found') && !depAuditReport.includes('No requirements.txt found.'));

            const hasErrors = hasLintErrors || hasSecurityIssues || hasCommentsLoggingIssues || hasDepAuditIssues;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && (
                comment.body.includes('🤖 Automated PR Review Bot Summary') ||
                comment.body.includes('⚠️ Automated PR Review')
              )
            );

            // Always write full summary to GitHub Actions job summary (zero email notifications)
            await core.summary
              .addHeading('Automated PR Review Summary')
              .addRaw(`Commit \`${context.sha.substring(0, 7)}\` status: ${hasErrors ? '❌ Issues Detected' : '✅ All Checks Passed Cleanly'}\n\n`)
              .addRaw(`- Lint Errors: ${hasLintErrors ? '❌ Issues found' : '✅ Clean'}\n`)
              .addRaw(`- Security Scan: ${hasSecurityIssues ? '❌ Issues found' : '✅ Clean'}\n`)
              .addRaw(`- Comments & Logging: ${hasCommentsLoggingIssues ? '❌ Issues found' : '✅ Clean'}\n`)
              .addRaw(`- Dependencies: ${hasDepAuditIssues ? '❌ Issues found' : '✅ Clean'}\n`)
              .write();

            if (!hasErrors) {
              console.log('✅ All PR checks passed cleanly. Skipping PR comment to avoid unnecessary email notifications.');
              if (botComment) {
                console.log('Cleaning up previous bot error comment now that all issues are resolved.');
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                });
              }
              return;
            }

            console.log('⚠️ Issues detected in PR review. Posting comment to notify author.');

            const body = [
              '### ⚠️ Automated PR Review: Issues Detected',
              '',
              `Hello! Automated code review detected issues for commit \`${context.sha.substring(0, 7)}\`:`,
              '',
              '#### 🔍 **1. Scope & Changed Files**',
              '```',
              changedFiles,
              '```',
              '',
              '#### 📦 **2. Dependency Health & Vulnerability Scan**',
              hasDepAuditIssues ? '```\n' + depAuditReport.substring(0, 800) + '\n```' : '✅ Dependencies audited cleanly - no known vulnerabilities.',
              '',
              '#### 💬 **3. Code Comments & Logging Audit**',
              hasCommentsLoggingIssues ? commentsLoggingReport.substring(0, 1500) : '✅ Comments and logging checks passed.',
              '',
              '#### 🛠️ **4. Code Quality & Linting**',
              hasLintErrors ? '```\n' + lintErrors.substring(0, 1000) + '\n```' : '✅ No critical syntax or style issues found.',
              '',
              '#### 🛡️ **5. Security & Vulnerability Audit**',
              hasSecurityIssues ? '```\n' + securityIssues.substring(0, 1000) + '\n```' : '✅ Security check passed cleanly.',
              '',
              '---',
              '*Automated review generated by PR Reviewer Bot (Comments restricted to errors/issues only)*'
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
